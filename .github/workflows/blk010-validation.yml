name: Project Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Runtime security boundaries
        env:
          NODE_ENV: production
          PORT: 3000
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
        run: |
          npm start > /tmp/vendedor-ia.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi; sleep 1; done
          cat /tmp/health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(h.status!=='ok'||h.block!=='BLK-200'||h.governance?.tenantIsolationEnforced!==true)throw new Error('runtime governance failed');"
          curl --silent --dump-header /tmp/headers.txt --output /dev/null http://127.0.0.1:3000/api/health
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^x-request-id:' /tmp/headers.txt
          if grep -qi '^x-powered-by:' /tmp/headers.txt; then exit 1; fi
          for PATHNAME in tenancy/context tenancy/memberships catalog customers conversations leads followups recovery channels dashboard quotes payments revenue-expansion plans/plan pilot/readiness release/readiness operations/ai-readiness; do
            STATUS=$(curl --silent --output /tmp/boundary.json --write-out '%{http_code}' -H 'x-tenant-id: tenant-spoofed' "http://127.0.0.1:3000/api/$PATHNAME")
            test "$STATUS" = "401"
          done
          STATUS=$(curl --silent --output /tmp/sales.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-tenant-id: tenant-spoofed' -d '{"leadId":"spoofed"}' http://127.0.0.1:3000/api/sales/decision)
          test "$STATUS" = "401"
          STATUS=$(curl --silent --output /tmp/ai-smoke.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-tenant-id: tenant-spoofed' http://127.0.0.1:3000/api/operations/ai-smoke)
          test "$STATUS" = "401"
          python - <<'PY' > /tmp/large.json
          import json
          print(json.dumps({'data':'x'*270000}))
          PY
          STATUS=$(curl --silent --output /tmp/large-response.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/large.json http://127.0.0.1:3000/api/auth/login)
          test "$STATUS" = "413"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/large-response.json','utf8'));if(r?.error?.code!=='PAYLOAD_TOO_LARGE')throw new Error('payload limit not normalized');"
      - name: Production Docker smoke test
        run: |
          docker build -t vendedor-ia-ci .
          docker run --rm -d --name vendedor-ia-ci \
            -e PORT=8080 \
            -e NODE_ENV=production \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789 \
            -e FIREBASE_PROJECT_ID=ci-project \
            -p 18080:8080 vendedor-ia-ci
          cleanup() { docker logs vendedor-ia-ci || true; docker rm -f vendedor-ia-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health > /tmp/docker-health.json; then
              cat /tmp/docker-health.json
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' vendedor-ia-ci 2>/dev/null | grep -q true; then
              echo 'Production container exited before health became ready.'
              docker logs vendedor-ia-ci || true
              exit 1
            fi
            sleep 1
          done
          echo 'Production container did not become healthy in time.'
          docker logs vendedor-ia-ci || true
          exit 1

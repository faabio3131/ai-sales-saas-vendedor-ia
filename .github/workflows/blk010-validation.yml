name: Project Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Runtime security boundaries
        env:
          NODE_ENV: production
          PORT: 3000
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
        run: |
          npm start > /tmp/vendedor-ia.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(h.status!=='ok') throw new Error('health status not ok'); if(h.block!=='BLK-030') throw new Error('runtime block is not BLK-030'); if(h.governance?.tenantIsolationEnforced!==true) throw new Error('tenant isolation flag missing'); if(Object.prototype.hasOwnProperty.call(h.governance||{},'multitenancyGuaranteed')) throw new Error('obsolete multitenancyGuaranteed present');"
          AUTH_STATUS=$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' http://127.0.0.1:3000/api/auth/session)
          cat /tmp/auth.json
          test "$AUTH_STATUS" = "401"
          TENANT_STATUS=$(curl --silent --output /tmp/tenant.json --write-out '%{http_code}' -H 'x-tenant-id: tenant-spoofed' http://127.0.0.1:3000/api/tenancy/context)
          cat /tmp/tenant.json
          test "$TENANT_STATUS" = "401"
          node -e "const fs=require('fs'); const t=JSON.parse(fs.readFileSync('/tmp/tenant.json','utf8')); if(t?.error?.code!=='SESSION_REQUIRED') throw new Error('tenant route accepted unauthenticated request');"

services:
  fulfillment-worker:
    image: ${ATENDEVENDEIA_IMAGE:?ATENDEVENDEIA_IMAGE_REQUIRED}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID_REQUIRED}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          if node dist/fulfillment-worker.cjs; then
            date +%s > /tmp/fulfillment-worker.last-success
          else
            echo 'fulfillment_cycle_failed' >&2
          fi
          sleep 15
        done
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /tmp/fulfillment-worker.last-success && test $$(($$(date +%s) - $$(cat /tmp/fulfillment-worker.last-success))) -le 300"
      interval: 60s
      timeout: 10s
      retries: 3
    # Credentials and external connector overlay provisioned only in T08.

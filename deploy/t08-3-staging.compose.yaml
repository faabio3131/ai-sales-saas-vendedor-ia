# T08.3 staging-only; never attach this project to a public proxy.
# Live PSP/WhatsApp operations fail closed in the application by default.
services:
  atendevende-staging:
    image: "${ATENDEVENDE_IMAGE:?Certified OCI digest required}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    ports:
      - "127.0.0.1:${ATENDEVENDE_STAGING_PORT:-18080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      SESSION_SECRET: "${SESSION_SECRET:?Provide external staging-only secret}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Provide isolated staging Firebase project}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://staging.invalid}"
      ATENDEVENDE_PILOT_LIVE_ENABLED: "false"
      ATENDEVENDE_PILOT_GO_LIVE_APPROVED: "false"
      ATENDEVENDE_PILOT_ALLOWED_UNITS: "{}"
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

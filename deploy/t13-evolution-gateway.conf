worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 8s;
    proxy_http_version 1.1;
    proxy_set_header Host evolution-app.atendevendeia.com.br;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    # Local process/config readiness only; end-to-end TLS/provider isolation is a separate gate.
    server {
        listen 127.0.0.1:8081;
        location = /healthz { return 200 "ok"; }
        location / { return 404; }
    }
    server {
        listen 443 ssl;
        server_name evolution-app.atendevendeia.com.br;
        ssl_certificate /run/evolution-tls/server.crt;
        ssl_certificate_key /run/evolution-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != evolution-app.atendevendeia.com.br) { return 421; }
        if ($http_apikey !~ "^[A-Za-z0-9_=-]{32,256}$") { return 401; }
        location = /instance/fetchInstances {
            if ($request_method != GET) { return 405; }
            if ($args !~ "^instanceName=avc-[a-f0-9]{40}$") { return 400; }
            proxy_pass http://evolution-provider:8080;
        }
        location ~ "^/(instance/(connectionState|connect)|webhook/find)/avc-[a-f0-9]{40}$" {
            if ($request_method != GET) { return 405; }
            if ($args != "") { return 400; }
            proxy_pass http://evolution-provider:8080;
        }
        location ~ "^/(webhook/set|message/sendText)/avc-[a-f0-9]{40}$" {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            proxy_pass http://evolution-provider:8080;
        }
        location ~ "^/instance/logout/avc-[a-f0-9]{40}$" {
            if ($request_method != DELETE) { return 405; }
            if ($args != "") { return 400; }
            proxy_pass http://evolution-provider:8080;
        }
        location / { return 404; }
    }
}

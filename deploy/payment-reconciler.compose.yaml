# Default: Google Secret Manager, compatible with Cloud Run payment connection references.
# For mounted per-tenant files, add deploy/payment-reconciler.mounted-vault.compose.yaml.
# Deploy only after matching the API's vault backend, tenant, recipient and Firestore.
# Requires the SAME tested application image deployed as the API and operator-owned secrets.
services:
  payment-reconciler:
    image: "${ATENDEVENDE_IMAGE:?Set the certified application image digest}"
    restart: unless-stopped
    init: true
    network_mode: bridge
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -s /tmp/payment-reconciler.last-success && last=$(cat /tmp/payment-reconciler.last-success) && now=$(date +%s) && test "$((now - last))" -ge 0 && test "$((now - last))" -le 1200'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5m
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      NODE_ENV: production
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Set the Firebase project ID}"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase/service-account.json
      PAYMENT_VAULT_BACKEND: GOOGLE_SECRET_MANAGER
    volumes:
      - "${PAYMENT_FIREBASE_CREDENTIAL_FILE:?Mount the service account credential file}:/run/secrets/firebase/service-account.json:ro"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          legacy_failed=0
          order_failed=0
          node dist/payment-reconciler.cjs || legacy_failed=1
          node dist/order-payment-workers.cjs || order_failed=1
          if [ "$$legacy_failed" -eq 0 ] && [ "$$order_failed" -eq 0 ]; then
            date +%s > /tmp/payment-reconciler.last-success
          else
            echo 'payment_reconciliation_cycle_failed' >&2
          fi
          sleep 300
        done
